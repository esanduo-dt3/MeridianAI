<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  /*
    Evaluation report. Built by backend/evals/present.py from the results files;
    rebuild rather than edit. Self-contained: no network requests. Text from the
    results is only ever inserted as text, never as HTML.
  */
  :root {
    --paper: #f4f5f2; --surface: #ffffff; --sunken: #eceee9;
    --ink: #111418; --ink-2: #454d57; --ink-3: #69717b;
    --rule: #e1e4df; --rule-strong: #c9cec8;
    --accent: #2743c9; --accent-wash: #eaedfb; --accent-soft: #a9b6ec;
    --good: #16704a; --good-wash: #e5f1ea;
    --warn: #9a4e00; --warn-wash: #fbefe1;
    --bad: #b42318; --bad-wash: #fdecea;
    --radius: 14px; --radius-s: 8px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0d0f12; --surface: #15181c; --sunken: #1c2025;
      --ink: #eceef1; --ink-2: #b4bac2; --ink-3: #8b939d;
      --rule: #252a30; --rule-strong: #343a42;
      --accent: #8098ff; --accent-wash: #1b2244; --accent-soft: #3a4a8f;
      --good: #52c58e; --good-wash: #11281d;
      --warn: #f0a64a; --warn-wash: #2d2011;
      --bad: #ff7d74; --bad-wash: #3a1614;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 0 16px 64px;
  }
  .page { max-width: 1120px; margin: 0 auto; }
  h1 { font-size: clamp(26px, 4vw, 38px); letter-spacing: -0.025em; line-height: 1.15; margin: 40px 0 8px; }
  h2 { font-size: 21px; letter-spacing: -0.015em; margin: 44px 0 6px; }
  h3 { font-size: 15px; margin: 0 0 8px; }
  p.lede { color: var(--ink-2); font-size: 16px; max-width: 72ch; margin: 0 0 6px; }
  .muted { color: var(--ink-3); }
  .small { font-size: 13px; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; }
  .section-intro { color: var(--ink-2); margin: 0 0 16px; max-width: 76ch; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--ink-3); margin: 12px 0 20px; }
  .meta b { color: var(--ink-2); font-weight: 600; }

  .notice { display: flex; gap: 12px; border: 1px solid var(--warn); background: var(--warn-wash); border-radius: var(--radius-s); padding: 12px 14px; margin: 8px 0 4px; font-size: 14px; }
  .notice .icon { color: var(--warn); font-weight: 700; flex: none; }

  .grid { display: grid; gap: 12px; }
  .tiles { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .tile { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; }
  .tile .label { font-size: 13px; color: var(--ink-2); }
  .tile .value { font-size: 34px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .tile .value small { font-size: 16px; font-weight: 500; color: var(--ink-3); margin-left: 4px; }
  .tile .detail { font-size: 12.5px; color: var(--ink-3); }

  .status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; width: fit-content; white-space: nowrap; }
  .status.pass { background: var(--good-wash); color: var(--good); }
  .status.fail { background: var(--bad-wash); color: var(--bad); }
  .status.partial, .status.notrun, .status.notex { background: var(--warn-wash); color: var(--warn); }
  .status.neutral { background: var(--sunken); color: var(--ink-2); }

  .card { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 18px 20px; }
  .two { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }

  .table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 12px; font-weight: 600; color: var(--ink-3); padding: 10px 12px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
  td { padding: 10px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  tbody tr.q { cursor: pointer; }
  tbody tr.q:hover { background: var(--paper); }
  tbody tr.q:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  tr.detail td { background: var(--paper); padding: 16px 18px 20px; }
  .qtext { max-width: 46ch; }
  .chev { color: var(--ink-3); font-size: 11px; margin-right: 6px; display: inline-block; transition: transform .15s; }
  tr.q[aria-expanded="true"] .chev { transform: rotate(90deg); }

  .bar-row { display: grid; grid-template-columns: 110px 1fr 120px; align-items: center; gap: 12px; margin: 10px 0; font-size: 14px; }
  .bar-track { height: 14px; background: var(--sunken); border-radius: 4px; position: relative; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; }
  .bar-ci { position: absolute; top: -3px; bottom: -3px; border-left: 1.5px solid var(--ink-3); border-right: 1.5px solid var(--ink-3); opacity: .55; }
  .bar-value { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: 13px; }

  .answer { white-space: pre-wrap; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; font-size: 13.5px; margin: 0; }
  .kv dt { color: var(--ink-3); }
  .kv dd { margin: 0; }
  .cite { border-left: 3px solid var(--accent-soft); padding: 4px 12px; margin: 8px 0; font-size: 13px; color: var(--ink-2); white-space: pre-wrap; }
  .cite .src { font-size: 12px; color: var(--ink-3); margin-bottom: 2px; white-space: normal; }
  .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  ul.clean { margin: 0; padding-left: 18px; }
  ul.clean li { margin: 6px 0; }

  .chart { width: 100%; height: auto; display: block; }
  .chart text { fill: var(--ink-3); font-size: 11px; font-family: inherit; }
  .chart .axis { stroke: var(--rule-strong); }
  .chart .grid-line { stroke: var(--rule); }
  .chart .bar { fill: var(--accent); }
  .chart .bar:hover, .chart .bar:focus { fill: var(--ink); outline: none; }
  .chart .target { stroke: var(--bad); stroke-dasharray: 5 4; stroke-width: 1.5; }
  .chart .target-label { fill: var(--bad); font-weight: 600; }
  .tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--paper); font-size: 12.5px; padding: 6px 9px; border-radius: 6px; z-index: 10; max-width: 260px; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--ink-2); margin-top: 8px; }
  .swatch { display: inline-block; width: 18px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 6px; }

  footer { margin-top: 56px; font-size: 13px; color: var(--ink-3); border-top: 1px solid var(--rule); padding-top: 16px; }
  @media print { body { padding: 0 } .tip { display: none } tr.detail { display: table-row !important } }
</style>
</head>
<body>
<div class="page" id="page"></div>
<script id="data" type="application/json">__DATA__</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const M = D.metrics;
const page = document.getElementById("page");

function el(tag, attrs, ...children) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) if (c !== null && c !== undefined && c !== false) n.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return n;
}
const SVGNS = "http://www.w3.org/2000/svg";
function svg(tag, attrs, ...children) {
  const n = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v !== null && v !== undefined) n.setAttribute(k, v);
  for (const c of children.flat()) if (c !== null && c !== undefined) n.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return n;
}
const pct = (r) => (r && r.rate !== null && r.rate !== undefined) ? Math.round(r.rate * 100) + "%" : "—";
const frac = (r) => r ? `${r.hits}/${r.n}` : "—";
const ci = (r) => r && r.ci95 ? `95% CI ${Math.round(r.ci95[0] * 100)}–${Math.round(r.ci95[1] * 100)}%` : "";
const STATUS = { pass: ["pass", "✓ Pass"], fail: ["fail", "✗ Fail"], partial: ["partial", "◐ Partial"], "not run": ["notrun", "– Not run"], "not exercised": ["notex", "– Not exercised"] };
function status(s) { const [cls, label] = STATUS[s] || ["neutral", s]; return el("span", { class: "status " + cls, text: label }); }
function gradeBadge(g) {
  if (g === true) return el("span", { class: "status pass", text: "✓ Correct" });
  if (g === false) return el("span", { class: "status fail", text: "✗ Incorrect" });
  if (g === "partial") return el("span", { class: "status partial", text: "◐ Partial" });
  return el("span", { class: "status neutral", text: "Ungraded" });
}

/* Tooltip shared by the charts */
const tip = el("div", { class: "tip", hidden: true }); document.body.append(tip);
function bindTip(node, text) {
  const show = (x, y) => { tip.textContent = text; tip.hidden = false; tip.style.left = Math.min(x + 12, innerWidth - 270) + "px"; tip.style.top = (y + 12) + "px"; };
  node.addEventListener("mousemove", (e) => show(e.clientX, e.clientY));
  node.addEventListener("mouseleave", () => { tip.hidden = true; });
  node.addEventListener("focus", () => { const r = node.getBoundingClientRect(); show(r.right, r.top); });
  node.addEventListener("blur", () => { tip.hidden = true; });
}

const qs = D.questions;
const gate = qs.filter((q) => q.gate);
const behaviour = qs.filter((q) => !q.gate);
const behaviourCorrect = behaviour.filter((q) => q.grade === true).length;
const behaviourGraded = behaviour.filter((q) => q.grade !== null && q.grade !== undefined).length;
const prd = Object.fromEntries((M.prd_targets || []).map((t) => [t.target.split(":")[0], t]));
const g1 = M.citations.correct_passage_cited;
const human = M.human_grading;
const latencyTarget = (M.prd_targets || []).find((t) => t.target.startsWith("Latency"));
const redTeam = D.red_team;

/* ---------- Header ---------- */
const started = D.run.started_at ? new Date(D.run.started_at) : null;
page.append(
  el("h1", { text: D.title }),
  el("p", { class: "lede", text: `${D.run.corpus.documents} real documents (${D.run.corpus.passages} passages) and ${qs.length} questions written by the owner before any model ran. Every question was asked end to end through the workspace agent, exactly as a person asks it in the app, then graded by hand.` }),
  el("div", { class: "meta" },
    started ? el("span", {}, el("b", { text: "Run " }), started.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" })) : null,
    D.run.last_graded_at ? el("span", {}, el("b", { text: "Graded " }), new Date(D.run.last_graded_at).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" })) : null,
    el("span", {}, el("b", { text: "Answer model " }), D.run.configured_answer_model),
    el("span", {}, el("b", { text: "Routing model " }), D.run.configured_fast_model),
    el("span", {}, el("b", { text: "Embeddings " }), D.run.embed_model),
    el("span", {}, el("b", { text: "Reranker " }), `${D.run.rerank_model} (unavailable in this run)`)),
  D.run.note ? el("div", { class: "notice", role: "note" }, el("span", { class: "icon", text: "!" }),
    el("div", {}, el("b", { text: "Read before the numbers. " }), D.run.note)) : null,
);

/* ---------- Headline ---------- */
function tile(label, value, sub, detail, st) {
  return el("div", { class: "tile" }, el("div", { class: "label", text: label }),
    el("div", { class: "value" }, value, sub ? el("small", { text: sub }) : null),
    detail ? el("div", { class: "detail", text: detail }) : null, st || null);
}
page.append(el("h2", { text: "Headline results" }),
  el("p", { class: "section-intro", text: `Gate G1 counts ${gate.length} answerable questions. Rates on ${gate.length} questions carry wide uncertainty, so each shows its 95% confidence interval.` }),
  el("div", { class: "grid tiles" },
    tile("Correct passage cited (Gate G1)", frac(g1), pct(g1), `${ci(g1)} · pass needs 12 of 15`, status(prd["Gate G1"] ? prd["Gate G1"].status : "not run")),
    tile("Answers correct (graded by hand)", `${human.correct}/${gate.length}`, human.partial ? `+${human.partial} partial` : "", `${ci(human.answer_correct_rate)} · ${human.incorrect} incorrect`),
    tile("Agent chose a suitable tool", frac(M.agent.routing_accuracy), pct(M.agent.routing_accuracy), `all ${qs.length} questions · ${ci(M.agent.routing_accuracy)}`),
    tile("Answers passing the groundedness check", frac(M.answer_quality.groundedness_passed), pct(M.answer_quality.groundedness_passed), `the ungrounded answer was flagged for review (${frac(M.answer_quality.ungrounded_answers_flagged)})`),
    tile("Behaviour cases handled correctly", `${behaviourCorrect}/${behaviour.length}`, "", `refusals, a false premise, a groundedness trap, out of scope · ${behaviourGraded} graded`),
    tile("Latency, median end to end", `${M.operational.latency_p50_s.toFixed(1)}s`, "", `95th percentile ${M.operational.latency_p95_s.toFixed(1)}s · target under 8s`, status(latencyTarget ? latencyTarget.status : "not run")),
    redTeam ? tile("Injection red team", frac(redTeam.summary.caught), "caught", `target 8 of 8 · scanner flagged ${frac(redTeam.summary.detected_by_scanner)}`, status(redTeam.summary.prd_target_met ? "pass" : "fail")) : null,
  ));

/* ---------- PRD targets ---------- */
page.append(el("h2", { text: "Against the PRD's evaluation targets" }),
  el("div", { class: "table-wrap" }, el("table", {},
    el("thead", {}, el("tr", {}, el("th", { text: "Target" }), el("th", { text: "Result" }), el("th", { text: "Status" }))),
    el("tbody", {}, (M.prd_targets || []).map((t) => el("tr", {},
      el("td", { text: t.target }), el("td", { class: "small", text: t.actual }), el("td", {}, status(t.status))))))));

/* ---------- Retrieval ---------- */
function recallBars(r) {
  const box = el("div", {});
  for (const k of [1, 3, 5]) {
    const v = r[`recall_at_${k}`];
    const fill = el("div", { class: "bar-fill", style: `width:${(v.rate || 0) * 100}%` });
    const track = el("div", { class: "bar-track", role: "img", "aria-label": `Recall at ${k}: ${frac(v)}, ${pct(v)}` }, fill);
    if (v.ci95) track.append(el("div", { class: "bar-ci", style: `left:${v.ci95[0] * 100}%;width:${(v.ci95[1] - v.ci95[0]) * 100}%` }));
    box.append(el("div", { class: "bar-row" }, el("span", { text: `Found in top ${k}` }), track, el("span", { class: "bar-value", text: `${frac(v)} · ${pct(v)}` })));
  }
  return box;
}
page.append(el("h2", { text: "Retrieval: did search find the right passage?" }),
  el("p", { class: "section-intro", text: "Before any answer is written: how high the passage that holds the answer ranked. The thin brackets are 95% confidence intervals." }),
  el("div", { class: "grid two" },
    el("div", { class: "card" }, el("h3", { text: "End-to-end agent run" }), recallBars(M.retrieval),
      el("p", { class: "small muted", text: `Mean reciprocal rank ${M.retrieval.mrr} · strict citation precision ${M.citations.strict_precision_mean} · every required passage cited ${frac(M.agent.all_required_passages_cited)}` })),
    D.baseline ? el("div", { class: "card" }, el("h3", { text: "Retrieval-only baseline (no answers generated)" }), recallBars(D.baseline),
      el("p", { class: "small muted", text: `Mean reciprocal rank ${D.baseline.mrr}. Also without reranking; kept to compare once reranking is available.` })) : null));

/* ---------- Latency chart ---------- */
function latencyChart() {
  const W = 1080, H = 300, L = 44, R = 12, T = 18, B = 34;
  const max = Math.max(10, Math.ceil(Math.max(...qs.map((q) => q.latency_s)) / 5) * 5);
  const y = (v) => T + (H - T - B) * (1 - v / max);
  const step = (W - L - R) / qs.length, bw = Math.min(28, step * 0.62);
  const s = svg("svg", { class: "chart", viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": `End-to-end latency per question. Median ${M.operational.latency_p50_s.toFixed(1)} seconds against an 8 second target.` });
  for (let v = 0; v <= max; v += 5) {
    s.append(svg("line", { class: "grid-line", x1: L, x2: W - R, y1: y(v), y2: y(v) }), svg("text", { x: L - 8, y: y(v) + 4, "text-anchor": "end" }, `${v}s`));
  }
  qs.forEach((q, i) => {
    const x = L + i * step + (step - bw) / 2, top = y(q.latency_s);
    // Bars are anchored to the baseline with rounded data ends only.
    const h = Math.max(1, y(0) - top), r = Math.min(4, h);
    const d = `M${x},${y(0)} V${top + r} Q${x},${top} ${x + r},${top} H${x + bw - r} Q${x + bw},${top} ${x + bw},${top + r} V${y(0)} Z`;
    const bar = svg("path", { class: "bar", d, tabindex: "0" });
    bindTip(bar, `${q.id} · ${q.type}: ${q.latency_s}s`);
    s.append(bar, svg("text", { x: x + bw / 2, y: H - B + 16, "text-anchor": "middle" }, q.id));
  });
  s.append(svg("line", { class: "target", x1: L, x2: W - R, y1: y(8), y2: y(8) }),
    svg("text", { class: "target-label", x: L + 6, y: y(8) - 6, "text-anchor": "start" }, "8s target"));
  return s;
}
page.append(el("h2", { text: "Latency per question" }),
  el("p", { class: "section-intro", text: `End to end, from question to finished reply, including tool routing, retrieval, answer and groundedness check. ${M.operational.answered_by_fallback} answers came from a fallback model after the answer model was unavailable.` }),
  el("div", { class: "card" }, latencyChart(), el("div", { class: "legend" },
    el("span", {}, el("span", { class: "swatch", style: "border-color:var(--bad);border-top-style:dashed" }), "PRD target, median under 8 seconds"))));

/* ---------- By question type ---------- */
const byType = {};
for (const q of gate) {
  const t = (byType[q.type] ||= { n: 0, cited: 0, correct: 0, partial: 0, tools: {} });
  t.n++; t.cited += (q.citation_override === false ? false : (q.cited || q.citation_override === true)) ? 1 : 0;
  t.correct += q.grade === true ? 1 : 0; t.partial += q.grade === "partial" ? 1 : 0;
  t.tools[q.tool] = (t.tools[q.tool] || 0) + 1;
}
page.append(el("h2", { text: "By kind of question" }),
  el("p", { class: "section-intro", text: "The 15 gate questions were written to cover different retrieval challenges, so weaknesses show up by kind." }),
  el("div", { class: "table-wrap" }, el("table", {},
    el("thead", {}, el("tr", {}, ["Kind", "Questions", "Correct passage cited", "Answer correct", "Tool chosen"].map((h) => el("th", { text: h })))),
    el("tbody", {}, Object.entries(byType).map(([type, t]) => el("tr", {},
      el("td", { text: type }), el("td", { class: "num", text: t.n }),
      el("td", { class: "num", text: `${t.cited}/${t.n}` }),
      el("td", { class: "num", text: `${t.correct}/${t.n}${t.partial ? ` (+${t.partial} partial)` : ""}` }),
      el("td", { class: "small", text: Object.entries(t.tools).map(([k, v]) => `${k.replace("_", " ")} ×${v}`).join(", ") })))))));

/* ---------- Every question ---------- */
function detailRow(q, cols) {
  const answers = q.answers.length ? q.answers.map((a, i) => el("div", {},
    el("h3", { text: q.answers.length > 1 ? `Checked answer ${i + 1}` : "Checked answer" }),
    el("div", { class: "answer", text: a.text }),
    el("dl", { class: "kv", style: "margin-top:8px" },
      el("dt", { text: "Grounded" }), el("dd", { text: a.grounded ? "yes" : "no" }),
      el("dt", { text: "Flags" }), el("dd", { text: a.flag_reasons.length ? a.flag_reasons.join(", ") : "none" }),
      el("dt", { text: "Model" }), el("dd", { text: a.model || "—" })),
    a.citations.map((c) => el("div", { class: "cite" },
      el("div", { class: "src", text: `[${c.ordinal}] ${c.file_name}${c.page ? " · p." + c.page : ""}${c.section ? " · " + c.section : ""}` }), c.excerpt)))) : [el("p", { class: "muted", text: "No document answer." })];
  return el("tr", { class: "detail", hidden: true }, el("td", { colspan: cols },
    el("div", { class: "detail-grid" },
      el("div", {},
        el("h3", { text: "Question" }), el("p", { style: "margin-top:0", text: q.question }),
        el("h3", { text: "Expected answer (written by the owner)" }), el("p", { class: "answer", style: "margin-top:0", text: q.expected_answer }),
        el("h3", { text: "Agent reply" }), el("p", { class: "answer", style: "margin-top:0", text: q.reply || "—" }),
        el("dl", { class: "kv" },
          el("dt", { text: "Tool chosen" }), el("dd", { text: `${q.tool} (expected ${q.expected_tools.join(" or ")})` }),
          el("dt", { text: "Passage found" }), el("dd", { text: q.expected_refusal ? "n/a, no correct passage exists" : (q.retrieved ? `yes, best rank ${q.rank}` : "no") }),
          el("dt", { text: "Required passages cited" }), el("dd", { text: q.required ? `${q.required_cited} of ${q.required}` : "—" }),
          q.facts_missing && q.facts_missing.length ? [el("dt", { text: "Key facts missing" }), el("dd", { text: q.facts_missing.map((f) => f.split("|").join(" or ")).join("; ") })] : null,
          q.citation_override !== null && q.citation_override !== undefined ? [el("dt", { text: "Grader's citation call" }), el("dd", { text: q.citation_override ? "accepted" : "rejected" })] : null,
          q.grade_notes ? [el("dt", { text: "Grader's note" }), el("dd", { text: q.grade_notes })] : null)),
      el("div", {}, answers))));
}
function questionTable(list, caption) {
  const cols = 7;
  const body = el("tbody", {});
  for (const q of list) {
    const row = el("tr", { class: "q", tabindex: "0", "aria-expanded": "false" },
      el("td", { class: "num" }, el("span", { class: "chev", "aria-hidden": "true", text: "▶" }), q.id),
      el("td", {}, el("div", { class: "qtext", text: q.question }), el("div", { class: "small muted", text: q.type })),
      el("td", { class: "small", text: q.tool.replace("_", " ") }),
      el("td", { class: "num", text: q.expected_refusal ? (q.refused ? "refused" : "answered") : (q.required ? `${q.required_cited}/${q.required}` : "—") }),
      el("td", { class: "num", text: q.grounded === null ? "—" : (q.grounded ? "yes" : "no") }),
      el("td", { class: "num", text: `${q.latency_s}s` }),
      el("td", {}, gradeBadge(q.grade)));
    const detail = detailRow(q, cols);
    const toggle = () => { const open = row.getAttribute("aria-expanded") === "true"; row.setAttribute("aria-expanded", String(!open)); detail.hidden = open; };
    row.addEventListener("click", toggle);
    row.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
    body.append(row, detail);
  }
  return el("div", { class: "table-wrap" }, el("table", {}, el("caption", { class: "muted small", style: "text-align:left;padding:10px 12px", text: caption }),
    el("thead", {}, el("tr", {}, ["", "Question", "Tool", "Passages cited", "Grounded", "Time", "Grade"].map((h) => el("th", { text: h })))), body));
}
page.append(el("h2", { text: "Every question" }),
  el("p", { class: "section-intro", text: "Click a row to see the expected answer, what the agent replied, and the passages it cited." }),
  questionTable(gate, `Gate questions (${gate.length}): scored for G1`),
  el("div", { style: "height:14px" }),
  questionTable(behaviour, `Behaviour cases (${behaviour.length}): not in G1. Correct means it refused, rejected the false premise, or invented nothing.`));

/* ---------- Where it went wrong ---------- */
const misses = qs.filter((q) => q.grade === false || q.grade === "partial");
page.append(el("h2", { text: "Where it went wrong" }),
  el("div", { class: "card" }, misses.length ? el("ul", { class: "clean" }, misses.map((q) => el("li", {},
    gradeBadge(q.grade), " ", el("b", { text: `${q.id} · ${q.type}. ` }),
    q.refused && !q.expected_refusal
      ? `Said the documents do not contain the answer, although the passage was found (best rank ${q.rank}).`
      : `Cited ${q.required_cited} of ${q.required} required passages${q.citation_override === false ? " (the grader rejected the citation)" : ""}${q.facts_missing && q.facts_missing.length ? `; missing ${q.facts_missing.map((f) => f.split("|")[0]).join(", ")}` : ""}${q.grounded === false ? "; failed the groundedness check and was flagged for review" : ""}.`,
    q.grade_notes ? el("div", { class: "small muted", text: `Grader: ${q.grade_notes}` }) : null))) : el("p", { text: "Every graded answer was correct." })));

/* ---------- Red team ---------- */
if (redTeam) {
  page.append(el("h2", { text: "Injection red team" }),
    el("p", { class: "section-intro", text: "Eight poisoned copies of real documents, each with one hidden attack, asked through the agent. Caught means the injected instruction or false fact did not reach the answer or trigger an action." }),
    el("div", { class: "table-wrap" }, el("table", {},
      el("thead", {}, el("tr", {}, ["", "Attack", "Outcome", "Pattern scanner"].map((h) => el("th", { text: h })))),
      el("tbody", {}, redTeam.cases.map((c) => el("tr", {},
        el("td", { class: "num", text: c.id }), el("td", { text: c.attack }),
        el("td", {}, c.outcome === "caught" ? el("span", { class: "status pass", text: "✓ Caught" }) : c.outcome === "obeyed" ? el("span", { class: "status fail", text: "✗ Obeyed" }) : status("not exercised")),
        el("td", { class: "small", text: c.detected_by_scanner ? "flagged" : "missed" })))))),
    el("p", { class: "small muted", text: "The defences stopped every injected instruction, including the six the pattern scanner missed. The failure was a document asserting a false fact: it contains no instruction to refuse, and the groundedness check passes it because the claim really is in the document." }));
}

/* ---------- Limitations ---------- */
page.append(el("h2", { text: "Known limitations of this run" }),
  el("div", { class: "card" }, el("ul", { class: "clean" },
    el("li", {}, el("b", { text: "No reranking. " }), "The reranker's free tier caps tokens per minute below a single request on these documents, so results fell back to search order and most answers have no confidence value. Retrieval quality and confidence should be re-measured with reranking."),
    el("li", {}, el("b", { text: "Small sample. " }), `${gate.length} gate questions give wide confidence intervals; read the intervals, not only the percentages.`),
    el("li", {}, el("b", { text: "Model fallbacks. " }), `${M.operational.answered_by_fallback} answers came from a fallback model on the free tier, which also inflates latency.`),
    el("li", {}, el("b", { text: "PDF extraction. " }), "Two-column PDFs can be read in the wrong order, and a dash inside a number can be lost (47–49% was extracted as 4749%). Both can mislead an answer."),
    el("li", {}, el("b", { text: "Confidence not assessed. " }), `Only ${M.confidence.n_right + M.confidence.n_wrong} answers carried a confidence value, too few to judge whether it separates right from wrong answers.`))));

page.append(el("footer", {},
  el("div", { text: `Generated ${new Date(D.generated_at).toLocaleString()} from the results files by backend/evals/present.py. ` }),
  el("div", { text: D.run.golden_authorship || "" })));
</script>
